<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 17px/1.4 -apple-system, system-ui, sans-serif; background: #f2f2f7; color: #1c1c1e; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    p { color: #6e6e73; margin: 0; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } p { color: #98989d; } }
  </style>
</head>
<body>
  <main>
    <h1>{{html .Settings.message}}</h1>
    <p>Served by a RasBeacon plugin at {{.Address}}.</p>
  </main>
</body>
</html>
